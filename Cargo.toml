[package]
name = "gitgud"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A git GUI for Windows with a sci-fi HUD aesthetic"
repository = "https://github.com/tornupgaming/gitgud"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["glow", "default_fonts"] }
# libgit2 bindings. default-features off drops ssh/https network stacks --
# we only do local reads/writes through libgit2; `fetch` shells out to the
# git CLI so the user's existing credential helpers keep working.
git2 = { version = "0.21", default-features = false }
# Native folder-picker dialog.
rfd = "0.17"
# Worktree watcher (ReadDirectoryChangesW) so external file changes refresh
# the status pane without refocusing. default-features off drops the
# macOS/serde extras.
notify = { version = "8", default-features = false }
# Diff syntax highlighting. Trimmed to parsing + the bundled Sublime syntax
# dump; yaml-load lets us add the Odin grammar the defaults lack.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-onig", "yaml-load"] }

# SystemParametersInfoW, to read the OS wheel-scroll-lines setting. Free:
# winit already compiles this exact crate version and feature.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# eframe is built with default-features off (to trim the wgpu/macOS extras), which
# also drops winit's windowing backends. Windows always has Win32, but Linux needs
# X11/Wayland enabled explicitly. Scoped to Linux so the Windows build is unchanged.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

# Size-optimized release build, so binary size measurements are honest.
[profile.release]
opt-level = "s"     # optimize for size over speed
lto = true          # link-time optimization, strips cross-crate dead code
codegen-units = 1   # slower compile, better optimization
strip = true        # remove debug symbols
panic = "abort"     # drop unwinding machinery
